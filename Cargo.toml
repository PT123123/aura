[package]
name = "aura"
version = "1.2.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
blake3 = "1.5"
bytemuck = { version = "1.19", features = ["derive"] }
dirs = "6.0"
feed-rs = "2.3"
gag = "1.0"
hcl = { package = "hcl-rs", version = "0.19" }
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "bmp",
    "webp",
] }
pollster = "1.0"
raw-window-handle = "0.6"
rand = "0.10"
regex = "1.10"
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "gzip",
    "brotli",
    "deflate",
    "stream",
] }
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
tokio = { version = "1.44", features = [
    "fs",
    "macros",
    "rt-multi-thread",
    "signal",
    "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
time = { version = "0.3", features = ["formatting"] }
url = "2.5"
walkdir = "2.5"
wgpu = { version = "30.0", features = ["spirv"] }
winit = "0.30"
slint = "1.18.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = "0.3"
ksni = "0.3.5"
libc = "0.2"
notify-rust = { version = "4.11", default-features = false, features = ["z-with-tokio"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-service-management = "0.3.2"
tray-icon = "0.24"

[dev-dependencies]
tempfile = "3.14"

[build-dependencies]
embed-resource = "3.0"
ico = "0.5"
image = { version = "0.25", default-features = false, features = [
    "png",
    "bmp",
] }
naga = { version = "30.0", features = ["glsl-in", "spv-out", "wgsl-in"] }

[target.'cfg(windows)'.build-dependencies]
slint-build = "1"

[profile.dev]
opt-level = 0
debug = 1
incremental = true
codegen-units = 256
lto = "off"

[profile.release]
strip = true    # Automatically strip symbols from the binary.
opt-level = 3
lto = true
